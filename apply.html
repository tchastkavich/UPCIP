        .menu {

          display: flex;
          justify-content: center;
          margin-right: 760px;
          margin-left: 760px;
        }

        .hidoggy {
          display: flex;
          justify-content: flex-start;
          padding-top: 293px;
          animation-name: pulse;
          animation-duration:  4s;
          animation-iteration-count: 3;
          animation-iteration-count: infinite; 
        }

        @keyframes pulse { 
          0% { 
            scale: 1; 
          }

          50% { 
            scale: 1.2; 
          }

          100% { 
            scale: 1; 
          }   

} 

        h2 {
          color: white;
          font-weight: normal;
        }

        .content {
          display: grid;
          grid-template-areas:
          "list list"
          "join join"
        }

        .content div.list {
          grid-area: list;
          display: flex;
          justify-content: center;
        }

        .content div.join {
          grid-area: join;
          display: flex;
          justify-content: center;
        }

        .termsl {
          cursor: url(images/link.cur), auto;
        }

        input[type="checkbox"] {
          cursor: url(images/link.cur), auto;
        }

                input[type="checkbox"],
