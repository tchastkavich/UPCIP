        .menu {
          display: grid;

        .titlebox {

          margin-right: 750px;

        }

        .hidoggy {
          display: flex;
          justify-content: flex-start;
          padding-top: 305px;
          animation-name: pulse;
          animation-duration:  4s;
          animation-iteration-count: 3;
          animation-iteration-count: infinite; 
        }

        @keyframes pulse { 
          0% { 
            scale: 1; 
          }

          50% { 
            scale: 1.2; 
          }

          100% { 
            scale: 1; 
          }
        }

        .content {
          display: grid;
          grid-template-areas:
          "list list"
          "join join"
        }

        .content div.join {
          grid-area: join;
          display: flex;
          justify-content: center;
        }

        .content div.list {
          grid-area: list;
          display: flex;
          justify-content: center;
        }

        h3 {
          color: white;
          font-weight: normal;
        }

        .list a {
          cursor: url(images/link.cur), auto;

        ol {

        .terms {
